name: Deploy stage

# Reusable workflow: before using the stage passed by the caller as a GitHub
# Environment, verify that the Environment already exists in the repository.
#
# Background: when a workflow references an Environment name that does not
# exist, GitHub Actions implicitly creates it without any protection rules
# (e.g. required reviewers), and runs the job as-is. Under this behavior, a
# typo or an unintended value in the Environment name written in a workflow
# can bypass the approval process entirely.
#
# The check-environment job verifies that inputs.stage is present in the
# actual list of Environments returned by the GitHub API, and fails the
# workflow before plan/apply run if it is not.
on:
  workflow_call:
    inputs:
      stage:
        description: Name of the Environment to reference
        required: true
        type: string

jobs:
  check-environment:
    name: Check environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify stage exists as a GitHub Environment
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ inputs.stage }}
        run: |
          if ! gh api "repos/${{ github.repository }}/environments" --jq '.environments[].name' \
              | grep -qFx -- "$STAGE"; then
            echo "::error::Environment '$STAGE' is not defined in this repository. Create it before referencing it from a workflow."
            exit 1
          fi
          echo "Environment '$STAGE' is defined."

  plan:
    name: Plan
    needs: check-environment
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    steps:
      - name: Run plan (dummy)
        run: echo "plan (dummy) for ${{ inputs.stage }}"

  apply:
    name: Apply
    needs: [check-environment, plan]
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    steps:
      - name: Run destructive operation (dummy)
        run: echo "destructive operation executed (dummy) for ${{ inputs.stage }}"
