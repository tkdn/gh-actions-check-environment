name: Deploy (unguarded)

# For comparison only — kept as a reference for the original incident, not
# meant to run automatically. It reproduces the behavior of referencing an
# undefined stage without any prior verification: `preview` is not
# pre-created as an Environment in this repository, and running this
# workflow confirms that GitHub auto-creates it without any protection
# rules. Triggered only via workflow_dispatch so it never runs as a side
# effect of opening a PR.
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    strategy:
      fail-fast: false
      matrix:
        stage:
          - preview
    uses: ./.github/workflows/deploy-stage-unguarded.yml
    with:
      stage: ${{ matrix.stage }}
