name: Deploy

# The list of stages is statically enumerated here, and this list is the single
# source of truth. Whether each stage actually exists as a GitHub Environment is
# verified by the check-environment job in deploy-stage.yml (reusable workflow).
on:
  pull_request:
    paths:
      - '.github/workflows/**'

# Scoped per PR so unrelated PRs never cancel each other. A new push to the
# same PR cancels any run (including one left pending on Required Reviewers
# approval) still in progress for that PR.
concurrency:
  group: deploy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    strategy:
      fail-fast: false
      matrix:
        stage:
          - development
          - staging
          - production
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: ${{ matrix.stage }}
